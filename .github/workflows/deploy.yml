# Continuous deployment: every push to main that changes the system updates the running server.
#   1. test     run the gateway's tests; a failing test stops the deploy
#   2. deploy   sign in to AWS with GitHub's OIDC token (no AWS keys stored anywhere),
#               sync café content to S3, run infra/deploy.sh on the instance through SSM,
#               then check https://<site>/health answers 200.
# One-time setup: infra/iam/setup-github-deploy.sh, then the 4 repository variables it prints.
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'gateway/**'
      - 'librechat/**'
      - 'content/**'
      - 'eval/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets the job ask GitHub for an OIDC token to present to AWS

concurrency:
  group: deploy-aws
  cancel-in-progress: false   # never interrupt a deploy halfway

env:
  AWS_REGION: ap-southeast-1

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check the repository variables are set
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          CONTENT_BUCKET: ${{ vars.CONTENT_BUCKET }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          missing=0
          for v in AWS_DEPLOY_ROLE_ARN INSTANCE_ID CONTENT_BUCKET SITE_ADDRESS; do
            if [ -z "${!v}" ]; then echo "::error::repository variable $v is not set (Settings > Secrets and variables > Actions > Variables, one variable per name)"; missing=1; fi
          done
          exit $missing

      # Prints only the token's claims (never the token itself), so a trust-policy
      # mismatch ("Not authorized to perform sts:AssumeRoleWithWebIdentity") is easy to see.
      - name: Show the identity GitHub presents to AWS
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$tok" <<'PY'
          import base64, json, sys
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("sub", "aud", "iss", "repository", "ref", "event_name"):
              print(f"{k:11} {c.get(k)}")
          PY

      - name: Sign in to AWS (OIDC, role KapeGithubDeploy)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Sync café content to S3 (the gateway picks it up within 5 minutes)
        run: ./infra/sync-content.sh "${{ vars.CONTENT_BUCKET }}"

      - name: Run deploy.sh on the instance (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          set -euo pipefail
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
                 --comment "GitHub deploy ${GITHUB_SHA::7}" \
                 --parameters 'commands=["/opt/kape/app/infra/deploy.sh"],executionTimeout=["900"]' \
                 --query Command.CommandId --output text)
          echo "SSM command $id"
          for i in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            echo "  $(date -u +%T) $status"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "----- output (last part) -----"
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -40
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -20
          [ "$status" = Success ] || { echo "::error::deploy.sh finished with status $status"; exit 1; }

      - name: Smoke test https://<site>/health
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${{ vars.SITE_ADDRESS }}/health" || true)
            echo "  attempt $i: HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::site did not answer 200 within 3 minutes of the deploy"; exit 1

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title>Kapé Lumen: AWS infrastructure design</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3a24"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #8c522d; stroke-width: 1.5; rx: 8; }
      .ctr { fill: #fbf3e8; stroke: #b98a63; stroke-width: 1.2; rx: 6; }
      .svc { fill: #eef4fb; stroke: #4a76a8; stroke-width: 1.5; rx: 8; }
      .ext { fill: #f3f3f3; stroke: #777; stroke-width: 1.5; rx: 8; stroke-dasharray: 5 3; }
      .t { fill: #2b1d14; }
      .b { font-weight: 700; }
      .s { font-size: 11.5px; fill: #5a4636; }
      .ln { stroke: #5b3a24; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .q { stroke: #c0392b; stroke-width: 2.4; fill: none; marker-end: url(#a); }
      .lq { fill: #c0392b; font-weight: 700; font-size: 12px; }
      .lb { fill: #5b3a24; font-size: 11px; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="630" fill="#ffffff"/>

  <!-- AWS region -->
  <rect x="212" y="14" width="736" height="606" rx="10" fill="#fffaf3" stroke="#d58b1f" stroke-width="2"/>
  <text x="226" y="34" class="t b" fill="#a3620a">AWS account · region ap-southeast-1 (Singapore)</text>

  <!-- EC2 -->
  <rect x="240" y="48" width="400" height="392" class="box"/>
  <text x="254" y="68" class="t b">EC2 t3.small · Ubuntu 24.04 · encrypted 30 GB disk</text>
  <text x="254" y="85" class="s">Elastic IP → 47-131-78-149.sslip.io · security group: 80/443 only, no SSH</text>

  <rect x="262" y="98" width="356" height="44" class="ctr"/>
  <text x="274" y="117" class="t b">Caddy</text><text x="274" y="133" class="s">HTTPS (Let's Encrypt certificate), HTTP → HTTPS</text>

  <rect x="262" y="158" width="356" height="44" class="ctr"/>
  <text x="274" y="177" class="t b">LibreChat (reskinned)</text><text x="274" y="193" class="s">Kapé Lumen chat page, sign-in, saved chats</text>

  <rect x="262" y="218" width="356" height="44" class="ctr"/>
  <text x="274" y="237" class="t b">MongoDB 8</text><text x="274" y="253" class="s">users and conversations · password on · no public port</text>

  <rect x="262" y="278" width="356" height="44" class="ctr"/>
  <text x="274" y="297" class="t b">brew-gateway (my Node service)</text><text x="274" y="313" class="s">adds café documents + key, calls the model, logs every question</text>

  <rect x="262" y="338" width="356" height="88" class="ctr" style="fill:#f6f6f6;stroke:#999"/>
  <text x="274" y="357" class="t b">cron jobs and CloudWatch agent</text>
  <text x="274" y="374" class="s">probe every minute · backup 02:00 · quality check 02:30</text>
  <text x="274" y="390" class="s">restore test Sundays 03:30 (Philippine time)</text>
  <text x="274" y="406" class="s">agent: memory and disk metrics, /var/log → CloudWatch</text>

  <!-- Systems Manager -->
  <rect x="240" y="462" width="400" height="50" class="svc"/>
  <text x="254" y="482" class="t b">Systems Manager</text>
  <text x="254" y="499" class="s">Session Manager (admin shell, no SSH) · Run Command (deploys)</text>
  <path d="M440,462 L440,442" class="ln"/>

  <!-- right column services -->
  <rect x="680" y="48" width="252" height="62" class="svc"/>
  <text x="692" y="68" class="t b">S3 bucket (private, versioned)</text>
  <text x="692" y="85" class="s">content/ café documents</text><text x="692" y="101" class="s">backups/ nightly, kept 14 days</text>

  <rect x="680" y="126" width="252" height="50" class="svc"/>
  <text x="692" y="146" class="t b">SSM Parameter Store</text>
  <text x="692" y="163" class="s">Gemini key, app secrets (SecureString)</text>

  <rect x="680" y="192" width="252" height="78" class="svc"/>
  <text x="692" y="212" class="t b">CloudWatch</text>
  <text x="692" y="229" class="s">logs /kape/* (14 days) · metric filters</text>
  <text x="692" y="245" class="s">custom metrics · dashboard</text>
  <text x="692" y="261" class="s">10 alarms</text>

  <rect x="680" y="290" width="252" height="44" class="svc"/>
  <text x="692" y="310" class="t b">SNS topic kape-alerts</text><text x="692" y="326" class="s">alarm, OK and nightly-check emails</text>

  <rect x="680" y="350" width="252" height="44" class="svc"/>
  <text x="692" y="370" class="t b">CloudTrail</text><text x="692" y="386" class="s">record of every AWS change</text>

  <rect x="680" y="406" width="252" height="74" class="svc"/>
  <text x="692" y="425" class="t b">IAM</text>
  <text x="692" y="441" class="s">EC2 role (least privilege)</text>
  <text x="692" y="456" class="s">admin only via a role that needs MFA</text>
  <text x="692" y="471" class="s">GitHub deploy role (OIDC, main only)</text>

  <rect x="680" y="492" width="252" height="44" class="svc"/>
  <text x="692" y="512" class="t b">AWS Budgets</text><text x="692" y="528" class="s">$10 monthly budget alert</text>

  <!-- outside AWS -->
  <rect x="16" y="98" width="178" height="50" class="ext"/>
  <text x="28" y="119" class="t b">Customer's browser</text><text x="28" y="136" class="s">anywhere on the internet</text>

  <rect x="16" y="236" width="178" height="60" class="ext"/>
  <text x="28" y="257" class="t b">GitHub repository</text><text x="28" y="273" class="s">Actions: test → deploy</text><text x="28" y="288" class="s">(OIDC, no stored keys)</text>

  <rect x="16" y="372" width="178" height="60" class="ext"/>
  <text x="28" y="393" class="t b">Google Gemini API</text><text x="28" y="409" class="s">gemini-3.5-flash-lite</text><text x="28" y="424" class="s">outside AWS, free tier</text>

  <rect x="16" y="560" width="178" height="44" class="ext"/>
  <text x="28" y="580" class="t b">Operator's inbox</text><text x="28" y="596" class="s">alerts arrive here</text>

  <!-- question path (red) -->
  <path d="M194,118 L262,118" class="q"/><text x="200" y="110" class="lq">1</text>
  <path d="M300,142 L300,158" class="q"/><text x="306" y="155" class="lq">2</text>
  <path d="M600,202 L600,278" class="q"/><text x="584" y="244" class="lq" style="display:none">3</text>
  <text x="605" y="270" class="lq">3</text>
  <path d="M262,306 L228,306 L228,400 L194,400" class="q"/><text x="214" y="344" class="lq">4</text>
  <path d="M194,412 L236,412 L236,316 L262,316" class="q" style="stroke-dasharray:4 3"/><text x="242" y="372" class="lq">5</text>

  <!-- other flows -->
  <path d="M300,202 L300,218" class="ln"/>
  <path d="M618,292 L680,82" class="ln"/><text x="650" y="128" class="lb">docs</text>
  <path d="M618,300 L680,152" class="ln"/>
  <text x="650" y="196" class="lb">key</text>
  <path d="M618,382 C650,382 650,240 680,240" class="ln"/><text x="644" y="312" class="lb">logs</text>
  <path d="M806,270 L806,290" class="ln"/>
  <path d="M618,360 C660,360 660,100 680,100" class="ln" style="stroke-dasharray:4 3"/>
  <path d="M680,326 L662,326 L662,582 L194,582" class="ln"/><text x="420" y="576" class="lb">email</text>
  <path d="M194,266 L222,266 L222,487 L240,487" class="ln"/><text x="150" y="315" class="lb" style="display:none">deploy</text>
  <text x="226" y="530" class="lb" transform="rotate(-90 226 530)">deploy</text>

  <!-- legend -->
  <rect x="680" y="548" width="252" height="62" fill="#ffffff" stroke="#ddd" rx="6"/>
  <path d="M692,566 L722,566" class="q"/><text x="730" y="570" class="s">a question: 1 → 4, answer back 5</text>
  <path d="M692,586 L722,586" class="ln"/><text x="730" y="590" class="s">data, logs, alerts, deploys</text>
  <path d="M692,602 L722,602" class="ln" style="stroke-dasharray:4 3"/><text x="730" y="606" class="s">nightly backup to S3</text>
</svg>
